<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <!-- Orange Gradient -->
    <linearGradient id="cartOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="50%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#E03000" />
    </linearGradient>
    <!-- Text Orange Gradient -->
    <linearGradient id="textOrangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>
  </defs>

  <!-- Speed Motion Lines behind cart -->
  <g fill="url(#cartOrangeGrad)" rx="4">
    <rect x="100" y="125" width="60" height="10" rx="5" />
    <rect x="130" y="150" width="50" height="10" rx="5" />
    <rect x="100" y="175" width="70" height="10" rx="5" />
    <rect x="120" y="200" width="40" height="10" rx="5" />
    <circle cx="95" cy="170" r="5" />
    <circle cx="110" cy="205" r="4" />
  </g>

  <!-- Main Cart Outer Shape -->
  <path d="M 175 100 
           C 200 100, 215 110, 225 140 
           L 350 140 
           C 365 140, 365 155, 350 160
           L 245 160
           C 220 160, 215 175, 220 200
           C 225 240, 240 260, 290 260
           L 330 260
           C 345 260, 345 275, 330 275
           L 280 275
           C 220 275, 195 240, 190 180
           L 180 140
           C 175 125, 165 120, 150 120
           L 140 120
           C 130 120, 130 100, 140 100 Z" 
        fill="url(#cartOrangeGrad)" />

  <!-- Cart Bowl & G Container -->
  <path d="M 220 145 
           L 350 145 
           C 365 145, 360 250, 280 250 
           C 225 250, 210 210, 220 145 Z" 
        fill="url(#cartOrangeGrad)" />

  <!-- White G inside Cart -->
  <path d="M 330 170 
           L 275 170 
           C 255 170, 245 180, 245 200 
           C 245 220, 255 230, 275 230 
           L 320 230 
           C 335 230, 340 220, 340 205 
           L 295 205 
           L 295 190 
           L 345 190 
           C 350 190, 355 195, 355 205 
           C 355 235, 335 245, 275 245 
           C 235 245, 225 225, 225 200 
           C 225 175, 240 155, 280 155 
           L 330 155 Z" 
        fill="#FFFFFF" />

  <!-- Cart Wheels -->
  <circle cx="235" cy="290" r="18" fill="url(#cartOrangeGrad)" />
  <circle cx="235" cy="290" r="8" fill="#111827" />

  <circle cx="310" cy="290" r="18" fill="url(#cartOrangeGrad)" />
  <circle cx="310" cy="290" r="8" fill="#111827" />

  <!-- CART GO Text -->
  <text x="60" y="340" font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="52" letter-spacing="2" fill="#FFFFFF">CART</text>
  <text x="310" y="340" font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="52" letter-spacing="2" fill="url(#textOrangeGrad)">GO</text>

  <!-- Speed streaks on "GO" -->
  <rect x="420" y="310" width="20" height="4" rx="2" fill="url(#textOrangeGrad)" />
  <rect x="425" y="320" width="15" height="4" rx="2" fill="url(#textOrangeGrad)" />
  <rect x="420" y="330" width="18" height="4" rx="2" fill="url(#textOrangeGrad)" />

  <!-- Subtitle Tagline -->
  <line x1="80" y1="370" x2="140" y2="370" stroke="url(#textOrangeGrad)" stroke-width="2" />
  <text x="150" y="374" font-family="'Inter', sans-serif" font-weight="800" font-size="14" letter-spacing="4" fill="#FF9900">SHOP MORE, GET MORE</text>
  <line x1="390" y1="370" x2="450" y2="370" stroke="url(#textOrangeGrad)" stroke-width="2" />
</svg>
